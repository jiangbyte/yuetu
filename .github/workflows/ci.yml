# CI：Flutter analyze / test，并构建 Android release APK
#
# Author: Charlie
#
# - push / PR：分析、测试、构建并上传 APK artifact
# - push v* tag：构建 + 发布 Release（附件为 APK）
# - workflow_dispatch + publish：按 pubspec 版本创建 tag 并发布

name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: '构建完成后按 pubspec.yaml 版本发布 GitHub Release'
        type: boolean
        default: false
      version:
        description: '覆盖版本号（可选，如 2.0.0；默认读 pubspec.yaml）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuetu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Resolve release meta
        id: meta
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            if [[ -z "${VER}" ]]; then
              VER="$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)"
            fi
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "apk_name=yuetu-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "Will publish ${TAG}"

      - name: Stage APK
        if: steps.meta.outputs.tag != ''
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.apk_name }}"
          ls -lh "${{ steps.meta.outputs.apk_name }}"

      - name: Load release notes
        id: notes
        if: steps.meta.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          FILE="docs/release-notes/v${VER}.md"
          DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            if [ -f "$FILE" ]; then
              if head -n1 "$FILE" | grep -qE '^# '; then
                tail -n +2 "$FILE"
              else
                cat "$FILE"
              fi
            else
              echo "月兔 ${{ steps.meta.outputs.tag }} 发布。"
              echo ""
              echo "- 附件：\`${{ steps.meta.outputs.apk_name }}\`（release）"
              echo "- 由 GitHub Actions 自动构建（Flutter）"
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 月兔 ${{ steps.meta.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
