# Release：推送 v* tag 时构建 H5 + Android debug APK，并发布 GitHub Release
#
# Author: Charlie
#
# 触发：推送 v* tag，或手动 workflow_dispatch（指定已有 tag）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 git tag（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "apk_name=yuetu-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build H5 (Capacitor)
        run: CAPACITOR=1 pnpm build:h5

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="${{ steps.meta.outputs.apk_name }}"
          cp "$SRC" "$DEST"
          ls -lh "$DEST"

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          FILE="docs/release-notes/v${VER}.md"
          DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            if [ -f "$FILE" ]; then
              if head -n1 "$FILE" | grep -qE '^# '; then
                tail -n +2 "$FILE"
              else
                cat "$FILE"
              fi
            else
              echo "月兔 ${{ steps.meta.outputs.tag }} 发布。"
              echo ""
              echo "- 附件：\`${{ steps.meta.outputs.apk_name }}\`（debug）"
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: ${{ steps.meta.outputs.apk_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
